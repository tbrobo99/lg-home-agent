<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Home Agent</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-ac" viewBox="0 0 24 24">
    <rect x="2.5" y="5" width="19" height="9" rx="2.5"/>
    <path d="M6 11h12M6 8.5h8"/>
    <path d="M7 17c0 1.4.8 2.2 2 2.2M12 17.4c0 1.6.9 2.6 2.2 2.6M17 17c0 1.2.6 1.9 1.6 1.9"/>
  </symbol>
  <symbol id="i-purifier" viewBox="0 0 24 24">
    <rect x="6.5" y="2.5" width="11" height="19" rx="3"/>
    <circle cx="12" cy="9" r="2.4"/>
    <path d="M9.5 16h5"/>
  </symbol>
  <symbol id="i-washer" viewBox="0 0 24 24">
    <rect x="3.5" y="3.5" width="17" height="17" rx="3"/>
    <circle cx="12" cy="13.5" r="4.4"/>
    <circle cx="7" cy="7" r="1"/>
  </symbol>
  <symbol id="i-fridge" viewBox="0 0 24 24">
    <rect x="5.5" y="2.5" width="13" height="19" rx="2.5"/>
    <path d="M5.5 9.5h13M8 5.5v2M8 12v3"/>
  </symbol>
  <symbol id="i-hood" viewBox="0 0 24 24">
    <path d="M4 4h16l-1.5 7h-13z"/>
    <path d="M12 11v6M8.5 20.5h7M9 17h6"/>
  </symbol>
  <symbol id="i-power" viewBox="0 0 24 24">
    <path d="M12 4.5v7"/>
    <path d="M7.6 7.2a7 7 0 1 0 8.8 0"/>
  </symbol>
  <symbol id="i-home" viewBox="0 0 24 24">
    <path d="M4 11.5L12 4l8 7.5"/>
    <path d="M6.5 10v9.5h11V10"/>
    <path d="M10.5 19.5v-5h3v5"/>
  </symbol>
  <symbol id="i-clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M12 7.5V12l3 1.8"/>
  </symbol>
  <symbol id="i-chat" viewBox="0 0 24 24">
    <path d="M4 5.5h16v10H9l-5 4z"/>
    <path d="M8 10h8M8 12.8h5"/>
  </symbol>
  <symbol id="i-send" viewBox="0 0 24 24">
    <path d="M4 12l16-7-6 16-3-6z"/>
  </symbol>
  <symbol id="i-mic" viewBox="0 0 24 24">
    <rect x="9" y="3" width="6" height="11" rx="3"/>
    <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6"/>
  </symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24">
    <path d="M4 9.5h3.5L12 6v12L7.5 14.5H4z"/>
    <path d="M15 9.5a4 4 0 0 1 0 5M17.5 7a7.5 7.5 0 0 1 0 10"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="M5 12.5l4.5 4.5L19 7.5"/>
  </symbol>
  <symbol id="i-x" viewBox="0 0 24 24">
    <path d="M6 6l12 12M18 6L6 18"/>
  </symbol>
  <symbol id="i-temp" viewBox="0 0 24 24">
    <path d="M12 13.6V5a2.1 2.1 0 1 1 4.2 0v8.6a4.2 4.2 0 1 1-4.2 0z"/>
    <path d="M14.1 9v6.4"/>
  </symbol>
  <symbol id="i-drop" viewBox="0 0 24 24">
    <path d="M12 3.4c3.4 3.9 5.2 6.4 5.2 8.8a5.2 5.2 0 1 1-10.4 0c0-2.4 1.8-4.9 5.2-8.8z"/>
  </symbol>
</svg>

<div class="app">

  <!-- ================= HOME ================= -->
  <section class="view" id="view-home">
    <header class="masthead">
      <h1>My Home</h1>
      <p class="stamp" id="stamp"></p>
    </header>

    <!-- The one thing the house has to say, in plain words. -->
    <div class="status" id="status">
      <svg class="status-icon" viewBox="0 0 24 24"><use href="#i-home"/></svg>
      <div>
        <strong id="statusLine">Everything is fine.</strong>
        <span id="statusDetail"></span>
      </div>
    </div>

    <!-- The house's last answer, kept on screen. A reply that vanishes after
         two seconds is not an answer for someone who reads slowly. -->
    <div class="reply" id="reply" hidden>
      <p class="reply-kicker">The house says</p>
      <p class="reply-text" id="replyText"></p>
    </div>

    <!-- A Tier-2 request waiting for an answer. The proposal's centrepiece:
         big question, two big answers, a clock that is honest about running out. -->
    <div class="ask" id="ask" hidden>
      <p class="ask-kicker">The house is asking</p>
      <p class="ask-question" id="askQuestion"></p>
      <div class="ask-answers">
        <button class="answer yes" id="askYes">
          <svg viewBox="0 0 24 24"><use href="#i-check"/></svg>
          <span>Yes<small>네</small></span>
        </button>
        <button class="answer no" id="askNo">
          <svg viewBox="0 0 24 24"><use href="#i-x"/></svg>
          <span>No<small>아니요</small></span>
        </button>
      </div>
      <p class="ask-clock" id="askClock"></p>
    </div>

    <div class="sec-head"><h2>Quick actions</h2></div>
    <div class="quick" id="quick"></div>

    <div class="sec-head"><h2>Rooms</h2></div>
    <div class="rooms" id="rooms"></div>

    <div class="sec-head">
      <h2 id="deviceHead">Devices</h2>
    </div>
    <div class="devices" id="devices"></div>
  </section>

  <!-- ================= SCHEDULE ================= -->
  <section class="view" id="view-schedule" hidden>
    <header class="masthead"><h1>Schedule</h1></header>
    <div class="jobs" id="jobs"></div>
  </section>

  <!-- ================= ASSISTANT ================= -->
  <section class="view" id="view-assistant" hidden>
    <header class="masthead">
      <h1>Assistant</h1>
      <div class="assistant-tools">
        <div class="mode-switch" id="modeSwitch" role="group" aria-label="How it decides">
          <button type="button" data-agent-mode="cascade" aria-pressed="false">Cascade</button>
          <button type="button" data-agent-mode="agent" aria-pressed="false">Agent</button>
        </div>
        <button type="button" id="tts" class="tts" aria-pressed="false" title="Read replies out loud">
          <svg viewBox="0 0 24 24"><use href="#i-speaker"/></svg>
          <span>Read aloud</span>
        </button>
      </div>
    </header>

    <div class="chat" id="chat"></div>
    <div class="chips" id="chips"></div>
  </section>

  <!-- The talk button is permanent: for the household this is the app. -->
  <div class="talkbar">
    <button class="talk" id="mic">
      <svg viewBox="0 0 24 24"><use href="#i-mic"/></svg>
      <span>Talk<small>말하기</small></span>
    </button>
    <form class="composer" id="composer">
      <input id="input" type="text" autocomplete="off" enterkeyhint="send" placeholder="Or type here…">
      <button type="button" id="lang" class="lang" title="Voice language">EN</button>
      <button type="submit" class="send" aria-label="Send">
        <svg viewBox="0 0 24 24"><use href="#i-send"/></svg>
      </button>
    </form>
  </div>

  <nav class="tabbar">
    <button class="tab active" data-tab="home">
      <svg viewBox="0 0 24 24"><use href="#i-home"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-tab="schedule">
      <svg viewBox="0 0 24 24"><use href="#i-clock"/></svg>
      <span>Schedule</span>
    </button>
    <button class="tab" data-tab="assistant">
      <svg viewBox="0 0 24 24"><use href="#i-chat"/></svg>
      <span>Assistant</span>
    </button>
  </nav>

  <div class="toast" id="toast" hidden></div>

</div>

<div class="sheet-scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-grip"></div>
  <div id="sheetBody"></div>
</section>

<script src="/app.js"></script>
</body>
</html>
