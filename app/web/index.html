<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e2a47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Home Agent</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-ac" viewBox="0 0 24 24">
    <rect x="2.5" y="5" width="19" height="9" rx="2.5"/>
    <path d="M6 11h12M6 8.5h8"/>
    <path d="M7 17c0 1.4.8 2.2 2 2.2M12 17.4c0 1.6.9 2.6 2.2 2.6M17 17c0 1.2.6 1.9 1.6 1.9"/>
  </symbol>
  <symbol id="i-purifier" viewBox="0 0 24 24">
    <rect x="6.5" y="2.5" width="11" height="19" rx="3"/>
    <circle cx="12" cy="9" r="2.4"/>
    <path d="M9.5 16h5"/>
  </symbol>
  <symbol id="i-washer" viewBox="0 0 24 24">
    <rect x="3.5" y="3.5" width="17" height="17" rx="3"/>
    <circle cx="12" cy="13.5" r="4.4"/>
    <circle cx="7" cy="7" r="1"/>
  </symbol>
  <symbol id="i-fridge" viewBox="0 0 24 24">
    <rect x="5.5" y="2.5" width="13" height="19" rx="2.5"/>
    <path d="M5.5 9.5h13M8 5.5v2M8 12v3"/>
  </symbol>
  <symbol id="i-hood" viewBox="0 0 24 24">
    <path d="M4 4h16l-1.5 7h-13z"/>
    <path d="M12 11v6M8.5 20.5h7M9 17h6"/>
  </symbol>
  <symbol id="i-mic" viewBox="0 0 24 24">
    <rect x="9" y="3" width="6" height="11" rx="3"/>
    <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6"/>
  </symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24">
    <path d="M4 9.5h3.5L12 6v12L7.5 14.5H4z"/>
    <path d="M15 9.5a4 4 0 0 1 0 5M17.5 7a7.5 7.5 0 0 1 0 10"/>
  </symbol>
  <symbol id="i-power" viewBox="0 0 24 24">
    <path d="M12 4.5v7"/>
    <path d="M7.6 7.2a7 7 0 1 0 8.8 0"/>
  </symbol>
  <symbol id="i-devices" viewBox="0 0 24 24">
    <rect x="3.5" y="3.5" width="7" height="7" rx="2"/>
    <rect x="13.5" y="3.5" width="7" height="7" rx="2"/>
    <rect x="3.5" y="13.5" width="7" height="7" rx="2"/>
    <rect x="13.5" y="13.5" width="7" height="7" rx="2"/>
  </symbol>
  <symbol id="i-clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M12 7.5V12l3 1.8"/>
  </symbol>
  <symbol id="i-chat" viewBox="0 0 24 24">
    <path d="M4 5.5h16v10H9l-5 4z"/>
    <path d="M8 10h8M8 12.8h5"/>
  </symbol>
  <symbol id="i-send" viewBox="0 0 24 24">
    <path d="M4 12l16-7-6 16-3-6z"/>
  </symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24">
    <path d="M9 6l6 6-6 6"/>
  </symbol>
  <symbol id="i-temp" viewBox="0 0 24 24">
    <path d="M12 13.6V5a2.1 2.1 0 1 1 4.2 0v8.6a4.2 4.2 0 1 1-4.2 0z"/>
    <path d="M14.1 9v6.4"/>
  </symbol>
  <symbol id="i-drop" viewBox="0 0 24 24">
    <path d="M12 3.4c3.4 3.9 5.2 6.4 5.2 8.8a5.2 5.2 0 1 1-10.4 0c0-2.4 1.8-4.9 5.2-8.8z"/>
  </symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24">
    <path d="M13.2 2.8L6 13.4h4.8L9.6 21.2 17.4 10.4h-5z"/>
  </symbol>
</svg>

<div class="phone">

  <header class="topbar">
    <nav class="rooms" id="rooms" aria-label="Rooms"></nav>
    <span class="backend" id="backend">Simulator</span>
    <span class="build" id="build" title="Build answering this page"></span>
  </header>

  <section class="summary" id="summary"></section>

  <main class="views">

    <section class="view" id="view-devices">
      <div class="grid" id="devices"></div>

      <div class="sec-head"><h2>Quick actions</h2></div>
      <div class="scenes" id="scenes"></div>

      <div class="sec-head">
        <h2>Next up</h2>
        <button class="ghost" data-tab="jobs">All</button>
      </div>
      <div class="jobs" id="nextUp"></div>
    </section>

    <section class="view" id="view-jobs" hidden>
      <div class="view-head">
        <h2>Schedule <span class="count" id="jobCount">0</span></h2>
        <button class="ghost" id="clearJobs">Clear all</button>
      </div>
      <div class="jobs" id="jobs"></div>
    </section>

    <section class="view chat-view" id="view-chat" hidden>
      <div class="mode-bar">
        <div class="mode-switch" id="modeSwitch" role="group" aria-label="How it decides">
          <button type="button" data-agent-mode="cascade" aria-pressed="false">Cascade</button>
          <button type="button" data-agent-mode="agent" aria-pressed="false">Agent</button>
        </div>
        <button type="button" id="tts" class="ghost tts" aria-pressed="false"
                title="Read replies out loud">
          <svg viewBox="0 0 24 24"><use href="#i-speaker"/></svg>
          <span>Read aloud</span>
        </button>
        <p class="mode-note" id="modeNote"></p>
      </div>
      <div class="chat" id="chat"></div>
      <div class="chips" id="chips"></div>
      <form class="composer" id="composer">
        <button type="button" id="mic" class="mic" aria-label="Voice input" aria-pressed="false">
          <svg viewBox="0 0 24 24"><use href="#i-mic"/></svg>
        </button>
        <input id="input" type="text" autocomplete="off" placeholder="Ask me anything…">
        <button type="button" id="lang" class="lang" title="Voice language">KO</button>
        <button type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24"><use href="#i-send"/></svg>
        </button>
      </form>
    </section>

  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="devices">
      <svg viewBox="0 0 24 24"><use href="#i-devices"/></svg>
      <span>Devices</span>
    </button>
    <button class="tab" data-tab="jobs">
      <svg viewBox="0 0 24 24"><use href="#i-clock"/></svg>
      <span>Schedule</span>
    </button>
    <button class="tab" data-tab="chat">
      <svg viewBox="0 0 24 24"><use href="#i-chat"/></svg>
      <span>Assistant</span>
    </button>
  </nav>

  <div class="toast" id="toast" hidden></div>

</div>

<div class="sheet-scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-grip"></div>
  <div id="sheetBody"></div>
</section>

<script src="/app.js"></script>
</body>
</html>
