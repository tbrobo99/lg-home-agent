<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Launch screen. tools/make_icons.py pins the body to each density's pixel
     size, so everything here is sized in percentages. -->
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    place-items: center;
    background: linear-gradient(168deg, #1d4468 0%, #12324f 42%, #0a1a2b 100%);
  }
  .mark {
    width: 32%; aspect-ratio: 1 / 1; border-radius: 24%;
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .14);
    display: grid; place-items: center; position: relative;
  }
  svg { width: 58%; height: 58%; fill: none; stroke: #fff;
        stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .dot { position: absolute; right: 16%; bottom: 16%; width: 12%; height: 12%;
         border-radius: 50%; background: #22c55e; }
</style>
</head>
<body>
<div class="mark">
  <svg viewBox="0 0 24 24">
    <rect x="2.5" y="5" width="19" height="9" rx="2.5"/>
    <path d="M6 11h12M6 8.5h8"/>
    <path d="M7 17c0 1.4.8 2.2 2 2.2M12 17.4c0 1.6.9 2.6 2.2 2.6M17 17c0 1.2.6 1.9 1.6 1.9"/>
  </svg>
  <div class="dot"></div>
</div>
</body>
</html>
