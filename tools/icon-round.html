<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Round launcher icon for devices without adaptive icons. -->
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  body { display: grid; place-items: center; }
  .disc {
    width: 100%; height: 100%; border-radius: 50%;
    background: linear-gradient(150deg, #1d4468, #0a1a2b);
    display: grid; place-items: center; position: relative;
  }
  svg { width: 52%; height: 52%; fill: none; stroke: #fff;
        stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .dot { position: absolute; right: 18%; bottom: 18%; width: 12%; height: 12%;
         border-radius: 50%; background: #22c55e; }
</style>
</head>
<body>
<div class="disc">
  <svg viewBox="0 0 24 24">
    <rect x="2.5" y="5" width="19" height="9" rx="2.5"/>
    <path d="M6 11h12M6 8.5h8"/>
    <path d="M7 17c0 1.4.8 2.2 2 2.2M12 17.4c0 1.6.9 2.6 2.2 2.6M17 17c0 1.2.6 1.9 1.6 1.9"/>
  </svg>
  <div class="dot"></div>
</div>
</body>
</html>
