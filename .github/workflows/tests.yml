name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The core has no third-party dependencies, so there is nothing to install.
      # This is deliberate: a fresh clone must run on a bare interpreter.
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test the server
        shell: bash
        run: |
          python run.py &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8848/api/snapshot > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8848/ > /dev/null
          curl -sf -X POST http://127.0.0.1:8848/api/chat \
            -H "Content-Type: application/json" \
            -d '{"text":"turn on the living room AC"}' | grep -q "is on"
          kill $SERVER_PID
